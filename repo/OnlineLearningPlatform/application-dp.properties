# App identity
spring.application.name=OnlineLearningPlatform
server.servlet.context-path=/OnlineLearningPlatform
server.port=9000

# DB connection - use Docker service name, not localhost
spring.datasource.url=jdbc:mysql://mysql:3306/OLP
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Swagger config
springfox.documentation.swagger.v2.path=/api-docs

# JWT settings
jwt.secret=foo
jwt.expiration=3600000

# Eureka Client settings
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://onlinelearning-eurekaserver:8761/eureka
eureka.instance.metadata-map.instanceId=OnlineLearningPlatform-9000
eureka.instance.prefer-ip-address=true

# Config server
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://onlinelearning-configserver:8888/

