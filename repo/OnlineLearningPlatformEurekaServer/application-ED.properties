spring.application.name=OnlineLearningPlatformEurekaServer
server.port=8761

# Eureka server instance hostname in docker
eureka.instance.hostname=onlinelearning-eurekaserver
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Set explicit peer URL using container name
eureka.client.service-url.defaultZone=http://onlinelearning-eurekaserver:8761/eureka/

eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=4000

management.endpoints.web.exposure.include=*
