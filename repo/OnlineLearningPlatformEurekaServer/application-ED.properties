spring.application.name=OnlineLearningPlatformEurekaServer
server.port=8761

# Eureka server itself settings
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# If you want peers in a real cluster, add them here:
# eureka.client.service-url.defaultZone=http://other-peer:8761/eureka

eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=4000

management.endpoints.web.exposure.include=*
