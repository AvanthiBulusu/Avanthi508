spring.application.name=OnlineLearningPlatformCourses
server.servlet.context-path=/OnlineLearningPlatformCourses
server.port=9001
spring.datasource.url=jdbc:mysql://mysql:3306/Course
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.springframework.data.jpa.repository.query=DEBUG

jwt.secret=foo
jwt.expiration=3600000

eureka.client.service-url.defaultZone=http://onlinelearning-eurekaserver:8761/eureka
eureka.instance.metadata-map.instanceId=OnlineLearningPlatformCourses-9001
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
