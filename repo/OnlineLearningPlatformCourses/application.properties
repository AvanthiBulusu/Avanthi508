spring.application.name=online-learning-platform-courses
server.servlet.context-path=/online-learning-platform-courses

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/Course
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.port=8081
logging.level.org.springframework.data.jpa.repository.query=DEBUG

jwt.secret=foo
jwt.expiration=3600000
